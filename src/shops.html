<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coff.ie.run</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">
    <link rel="manifest" href="images/icons/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style/custom_style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav-header></nav-header>
    <main>
        <div class="container">
            <h1>Shops</h1>

            <div class="controls">
                <div class="search-box">
                    <label for="search">Search shop by name:</label>
                    <input type="text" id="search" placeholder="Enter shop name...">
                </div>

                <div class="filters">
                    <div class="filter-group">
                        <label for="location">Filter by location:</label>
                        <select id="location">
                            <option value="" selected>All Cities</option>
                            <option value="Downtown">Redlands</option>
                            <option value="Uptown">San Bernardino</option>
                            <option value="Suburbs">Riverside</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <i class="fa-solid fa-receipt"></i>
                        <label for="visited">Visited by Coffiebara:</label>
                        <input type="checkbox" id="visited">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <nav-footer></nav-footer>
</body>
